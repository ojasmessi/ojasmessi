<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03070c"/>
      <stop offset="0.55" stop-color="#071421"/>
      <stop offset="1" stop-color="#0a1f2e"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0e3346" stroke-width="0.6"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- background + grid -->
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity="0.7"/>

    <!-- faint binary rain (left) -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#00ff9c" opacity="0.13">
      <text x="18" y="40">01001111</text><text x="18" y="60">10110100</text><text x="18" y="80">00111010</text>
      <text x="18" y="100">11010011</text><text x="18" y="120">01101110</text><text x="18" y="140">10011001</text>
      <text x="18" y="160">01110010</text><text x="18" y="180">11001010</text><text x="18" y="200">00101101</text>
      <text x="18" y="220">10100110</text><text x="18" y="240">01011100</text><text x="18" y="260">11100001</text>
      <text x="18" y="280">00011011</text><text x="18" y="300">10110010</text>
    </g>

    <!-- terminal window -->
    <g transform="translate(110,42)">
      <rect width="640" height="236" rx="10" fill="#050b12" fill-opacity="0.82" stroke="#12485f" stroke-width="1.2"/>
      <rect width="640" height="28" rx="10" fill="#0b1a26"/>
      <rect y="18" width="640" height="10" fill="#0b1a26"/>
      <circle cx="18" cy="14" r="5" fill="#ff5f56"/>
      <circle cx="36" cy="14" r="5" fill="#ffbd2e"/>
      <circle cx="54" cy="14" r="5" fill="#27c93f"/>
      <text x="320" y="18.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#5f8aa0">ojas@soc-lab: ~ — bash</text>

      <g font-family="Consolas, 'Courier New', monospace" xml:space="preserve">
        <text x="22" y="62" font-size="15"><tspan fill="#00ff9c">ojas@soc-lab</tspan><tspan fill="#5f8aa0">:</tspan><tspan fill="#36bcf7">~</tspan><tspan fill="#c9d6df">$ whoami</tspan></text>

        <text x="22" y="112" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="3" filter="url(#glow)">OJAS PATIL</text>

        <text x="22" y="146" font-size="15" fill="#36bcf7" letter-spacing="1.2">Security Operations <tspan fill="#00ff9c">▸</tspan> Detection Engineering <tspan fill="#00ff9c">▸</tspan> AI Security</text>

        <text x="22" y="180" font-size="13" fill="#8fa8b8"><tspan fill="#00ff9c">[+]</tspan> SIEM    : Microsoft Sentinel · Wazuh · Splunk</text>
        <text x="22" y="200" font-size="13" fill="#8fa8b8"><tspan fill="#00ff9c">[+]</tspan> Intel   : MITRE ATT&amp;CK · MITRE ATLAS · OWASP LLM Top 10</text>
        <text x="22" y="220" font-size="13" fill="#8fa8b8"><tspan fill="#00ff9c">[+]</tspan> Creds   : MSc Cyber Security (NCI) · CEH v12 · Dublin, IE</text>

        <!-- blinking cursor -->
        <rect x="22" y="228" width="9" height="3" fill="#00ff9c">
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- radar / threat map (right) -->
    <g transform="translate(985,160)">
      <circle r="118" fill="none" stroke="#12485f" stroke-width="1"/>
      <circle r="88" fill="none" stroke="#12485f" stroke-width="1"/>
      <circle r="58" fill="none" stroke="#12485f" stroke-width="1"/>
      <circle r="28" fill="none" stroke="#12485f" stroke-width="1"/>
      <line x1="-118" y1="0" x2="118" y2="0" stroke="#12485f"/>
      <line x1="0" y1="-118" x2="0" y2="118" stroke="#12485f"/>

      <!-- sweep -->
      <g>
        <path d="M0 0 L118 0 A118 118 0 0 0 83.4 -83.4 Z" fill="url(#sweep)" transform="scale(1)"/>
        <line x1="0" y1="0" x2="118" y2="0" stroke="#00ff9c" stroke-width="1.5" filter="url(#glow)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="5s" repeatCount="indefinite"/>
      </g>

      <!-- detections -->
      <g filter="url(#softglow)">
        <circle cx="52" cy="-64" r="4" fill="#ff3b5c">
          <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-70" cy="38" r="3.5" fill="#ffbd2e">
          <animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="30" cy="72" r="3" fill="#00ff9c">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-40" cy="-46" r="3" fill="#36bcf7">
          <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- shield core -->
      <g filter="url(#glow)">
        <path d="M0 -20 L16 -13 L16 2 C16 12 8 18 0 22 C-8 18 -16 12 -16 2 L-16 -13 Z" fill="#071421" stroke="#36bcf7" stroke-width="2"/>
        <path d="M-6 1 L-1 6 L7 -4" fill="none" stroke="#00ff9c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <text y="146" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#5f8aa0" letter-spacing="2">THREAT MONITORING · ACTIVE</text>
    </g>

    <!-- scanline -->
    <rect x="0" y="-60" width="1200" height="60" fill="url(#scan)">
      <animate attributeName="y" from="-60" to="320" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- bottom accent -->
    <rect x="0" y="316" width="1200" height="4" fill="#00ff9c" opacity="0.55"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#12485f"/>
</svg>
